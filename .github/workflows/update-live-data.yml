name: Update live city data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # MGM answers GitHub's runners, so the forecast is fetched here.
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live-data-forecast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch MGM forecast
        env:
          LIVE_SOURCES: forecast
        run: node scripts/update-live-data.mjs
      - name: Commit changed data
        env:
          LIVE_SOURCES: forecast
        run: scripts/commit-live-data.sh "Update live MGM forecast"

  # İSKİ and İBB only accept Turkish IPs, so this job runs on a self-hosted
  # runner in Turkey labelled "turkiye". While that machine is offline the job
  # waits in the queue (and is superseded by the next hour's run); the page keeps
  # showing the last measurement with its date.
  reservoir:
    runs-on: [self-hosted, turkiye]
    timeout-minutes: 10
    concurrency:
      group: live-data-reservoir
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch İSKİ reservoir data
        env:
          LIVE_SOURCES: reservoir
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
          APIFY_PROXY_USERNAME: ${{ vars.APIFY_PROXY_USERNAME }}
        run: node scripts/update-live-data.mjs
      - name: Commit changed data
        env:
          LIVE_SOURCES: reservoir
        run: scripts/commit-live-data.sh "Update live İSKİ reservoir data"
