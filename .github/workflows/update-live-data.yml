name: Update live city data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch İSKİ reservoir and MGM forecast data
        run: node scripts/update-live-data.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/data/live.json && ! git ls-files --others --exclude-standard -- public/data/live.json | grep -q .; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live.json
          git commit -m "Update live İSKİ/MGM data"
          git push
